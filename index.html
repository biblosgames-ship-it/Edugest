<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Edugest - Gestión Escolar Inteligente</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Edugest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />

    <style>
      #emergency-loader {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #090d16;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        padding: 24px;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .emergency-card {
        max-width: 400px;
        width: 100%;
        background: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        padding: 32px 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      }
      .emergency-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.5);
      }
      .emergency-btn {
        width: 100%;
        padding: 15px 20px;
        margin-top: 14px;
        background: #4f46e5;
        color: #ffffff;
        border: none;
        border-radius: 16px;
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        display: block;
      }
      .emergency-btn:active {
        transform: scale(0.98);
      }
      .emergency-btn-subtle {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #94a3b8;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="emergency-loader">
      <div class="emergency-card">
        <div class="emergency-icon">⚡</div>
        <h2 style="margin: 0 0 8px; font-size: 20px; font-weight: 900; color: #ffffff; letter-spacing: -0.02em;">
          Actualización de Edugest
        </h2>
        <p id="emergency-desc" style="margin: 0 0 20px; font-size: 13px; line-height: 1.5; color: #94a3b8;">
          Se ha publicado una versión más reciente. Si tu teléfono muestra pantalla en blanco o no carga, pulsa el botón para restablecer y entrar:
        </p>
        <button class="emergency-btn" onclick="window.emergencyResetApp()">
          🔄 Restablecer y Cargar App
        </button>
        <button class="emergency-btn emergency-btn-subtle" onclick="window.location.reload()">
          Reintentar Carga
        </button>
      </div>
    </div>

    <script>
      window.emergencyResetApp = async function() {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) {
              await regs[i].unregister();
            }
          }
          if ('caches' in window) {
            var names = await caches.keys();
            for (var j = 0; j < names.length; j++) {
              await caches.delete(names[j]);
            }
          }
        } catch (e) {}
        try {
          localStorage.clear();
          sessionStorage.clear();
        } catch (e) {}
        window.location.href = window.location.origin + window.location.pathname + '?v=' + Date.now();
      };

      // Si el root no se ha renderizado en 3.5 segundos, mostrar pantalla de restablecimiento
      var emergencyTimer = setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          var el = document.getElementById('emergency-loader');
          if (el) el.style.display = 'flex';
        }
      }, 3500);

      // Si React carga con éxito, ocultar y cancelar timer
      window.addEventListener('DOMContentLoaded', function() {
        var interval = setInterval(function() {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) {
            clearTimeout(emergencyTimer);
            clearInterval(interval);
            var el = document.getElementById('emergency-loader');
            if (el) el.style.display = 'none';
          }
        }, 200);
      });

      // Capturar errores de carga de chunks o módulos en la PWA
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        var filename = (e && e.filename) ? e.filename : '';
        if (
          msg.includes('module') ||
          msg.includes('chunk') ||
          msg.includes('Loading') ||
          msg.includes('SyntaxError') ||
          msg.includes('dynamically') ||
          filename.includes('.js')
        ) {
          var el = document.getElementById('emergency-loader');
          if (el) {
            var desc = document.getElementById('emergency-desc');
            if (desc) desc.textContent = 'Tu dispositivo tenía una versión anterior en memoria que ya no coincide con el servidor. Pulsa para restablecer:';
            el.style.display = 'flex';
          }
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
